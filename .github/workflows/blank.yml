name: Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GO_VERSION: "1.24.2"
      GOBIN: "/usr/local/bin"
      GOPATH: "${{ github.workspace }}/go"
      SECLISTS: "/usr/share/seclists"
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup system
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc make pkg-config \
            libcurl4-openssl-dev python3 python3-pip python3-venv \
            chromium-browser chromium libcjson-dev ruby ruby-dev zlib1g-dev \
            procps file tor proxychains4 nikto \
            perl libnet-ssleay-perl libwww-perl \
            libssl-dev build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up PATH for Go tools
        run: |
          echo "${{ env.GOPATH }}/bin" >> $GITHUB_PATH
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          make clean all
          test -x ./sentinel && echo "✅ binary OK"

      - name: Upload sentinel binary
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-binary
          path: sentinel
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    needs: build
    env:
      GOBIN: "/usr/local/bin"
      GOPATH: "${{ github.workspace }}/go"
      SECLISTS: "/usr/share/seclists"
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup system (for test)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc make pkg-config \
            libcurl4-openssl-dev python3 python3-pip python3-venv \
            chromium-browser chromium libcjson-dev ruby ruby-dev zlib1g-dev \
            procps file tor proxychains4 nikto dnsutils \
            perl libnet-ssleay-perl libwww-perl
          pip install playwright
          playwright install chromium

      - name: Install Go tools
        run: |
          set -euo pipefail
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install -v github.com/PentestPad/subzy@latest
          go install -mod=mod github.com/haccer/subjack@latest
          go install github.com/OJ/gobuster/v3@latest 

      - name: Install wpscan with proper permissions
        run: |
          set -euo pipefail
          gem install --user-install wpscan 2>&1 || echo "[WARN] wpscan install failed"
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> $GITHUB_PATH

      - name: Setup XSStrike
        run: |
          set -euo pipefail
          if [ ! -d /opt/XSStrike ]; then
            sudo git clone --depth 1 https://github.com/s0md3v/XSStrike /opt/XSStrike
          fi
          sudo python3 -m venv /opt/xsenv 2>/dev/null || true
          sudo /opt/xsenv/bin/pip install --upgrade pip -q
          sudo /opt/xsenv/bin/pip install -r /opt/XSStrike/requirements.txt -q

      - name: Download SecLists
        run: |
          set -euo pipefail
          sudo mkdir -p "${SECLISTS}/Discovery/DNS" "${SECLISTS}/Discovery/Web-Content"
          sudo curl -fsSL \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt" \
            -o "${SECLISTS}/Discovery/DNS/subdomains-top1million-5000.txt"
          sudo curl -fsSL \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" \
            -o "${SECLISTS}/Discovery/Web-Content/common.txt"

          echo "greet" | sudo tee -a /usr/share/seclists/Discovery/Web-Content/common.txt
            
      - name: Download sentinel binary
        uses: actions/download-artifact@v4
        with:
          name: sentinel-binary

      - name: Make binary executable
        run: chmod +x sentinel

      - name: Run Subdomain test
        continue-on-error: true
        run: |
          set -e
          export PATH="$(ruby -e 'puts Gem.user_dir')/bin:$PATH"
          # Run tests for sentinel
          ./sentinel rapyd.org test_sub -sub
          
      - name: Run Scan URL test
        continue-on-error: true
        run: |
          set -e

          ./sentinel thegod.pythonanywhere.com testscansite --scan-url https://thegod.pythonanywhere.com/echo

          ./sentinel thegod.pythonanywhere.com testscansite --scan-url https://thegod.pythonanywhere.com/preview

          ./sentinel thegod.pythonanywhere.com testscansite --scan-url https://thegod.pythonanywhere.com/search

          ./sentinel thegod.pythonanywhere.com testscansite --scan-url https://thegod.pythonanywhere.com/user

      - name: Run Scan Site test
        continue-on-error: true
        run: |
          set -e
           ./sentinel thegod.pythonanywhere.com testscansite --scan-site "https://thegod.pythonanywhere.com/

      - name: Run Xss test
        continue-on-error: true
        run: |
          set -e
          echo "XSS TEST"
          ./sentinel thegod.pythonanywhere.com testscansite --scan-site https://thegod.pythonanywhere.com/xss

          ./sentinel thegod.pythonanywhere.com testscansite --scan-site https://thegod.pythonanywhere.com/nuclei-xss

      - name: Upload all test output directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            test_sub/
            testscanurl/
            testscansite/
            testxsslow/
            testxssmedium/
            testxsshigh/
            testxssimpossible/
            ghostquery/
          retention-days: 14
