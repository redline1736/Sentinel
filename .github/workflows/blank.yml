name: Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GO_VERSION: "1.24.2"
      GOBIN: "/usr/local/bin"
      GOPATH: "${{ github.workspace }}/go"
      SECLISTS: "/usr/share/seclists"
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup system
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # NOTE: libsdl3-dev / libsdl3-ttf-dev are NOT in Ubuntu 24.04.
          # SDL3 is provided by the setup-sdl action below.
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc make pkg-config \
            libcurl4-openssl-dev python3 python3-pip python3-venv \
            chromium libcjson-dev ruby ruby-dev zlib1g-dev \
            procps file tor proxychains4 nikto \
            perl libnet-ssleay-perl libwww-perl \
            libssl-dev build-essential cmake ninja-build

      - name: Setup SDL3 + SDL3_ttf
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          install-linux-dependencies: true
          version: 3-latest
          version-sdl-ttf: 3-latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up PATH for Go tools
        run: |
          echo "${{ env.GOPATH }}/bin" >> $GITHUB_PATH
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          make clean all
          test -x ./sentinel && echo "✅ binary OK"

      - name: Upload sentinel binary
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-binary
          path: sentinel
          retention-days: 7
