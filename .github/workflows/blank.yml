name: Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GO_VERSION: "1.24.2"
      GOBIN: "/usr/local/bin"
      GOPATH: "${{ github.workspace }}/go"
      SECLISTS: "/usr/share/seclists"
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup system
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # NOTE: SDL packages removed — nothing in src/ links SDL anymore
          # (Makefile LIBS = -lcurl -lpthread -lcjson -lm only).
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc make pkg-config \
            libcurl4-openssl-dev python3 python3-pip python3-venv \
            chromium libcjson-dev ruby ruby-dev zlib1g-dev \
            procps file tor proxychains4 nikto \
            perl libnet-ssleay-perl libwww-perl \
            libssl-dev build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up PATH for Go tools
        run: |
          echo "${{ env.GOPATH }}/bin" >> $GITHUB_PATH
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          make clean all
          test -x ./sentinel && echo "✅ binary OK"

      - name: Upload sentinel binary
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-binary
          path: sentinel
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    needs: build
    env:
      GOBIN: "/usr/local/bin"
      GOPATH: "${{ github.workspace }}/go"
      SECLISTS: "/usr/share/seclists"
      CHROME_BIN: "/usr/bin/chromium"
      DEBIAN_FRONTEND: "noninteractive"
    outputs:
      failed_tests: ${{ steps.summary.outputs.failed_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup system (for test)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # chromium-browser dropped (snap-transition package, unreliable on
          # runners); Playwright's managed Chromium is the test browser.
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc make pkg-config \
            libcurl4-openssl-dev python3 python3-pip python3-venv \
            chromium libcjson-dev ruby ruby-dev zlib1g-dev \
            procps file tor proxychains4 nikto dnsutils \
            perl libnet-ssleay-perl libwww-perl
          pip install playwright
          playwright install chromium

      - name: Install Go tools
        run: |
          set -euo pipefail
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install -v github.com/PentestPad/subzy@latest
          go install -mod=mod github.com/haccer/subjack@latest
          go install github.com/OJ/gobuster/v3@latest

      - name: Install wpscan with proper permissions
        run: |
          set -euo pipefail
          gem install --user-install wpscan 2>&1 || echo "[WARN] wpscan install failed"
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> $GITHUB_PATH

      - name: Setup XSStrike
        run: |
          set -euo pipefail
          if [ ! -d /opt/XSStrike ]; then
            sudo git clone --depth 1 https://github.com/s0md3v/XSStrike /opt/XSStrike
          fi
          sudo python3 -m venv /opt/xsenv 2>/dev/null || true
          sudo /opt/xsenv/bin/pip install --upgrade pip -q
          sudo /opt/xsenv/bin/pip install -r /opt/XSStrike/requirements.txt -q

      - name: Download SecLists
        run: |
          set -euo pipefail
          sudo mkdir -p "${SECLISTS}/Discovery/DNS" "${SECLISTS}/Discovery/Web-Content"
          sudo curl -fsSL \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt" \
            -o "${SECLISTS}/Discovery/DNS/subdomains-top1million-5000.txt"
          sudo curl -fsSL \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" \
            -o "${SECLISTS}/Discovery/Web-Content/common.txt"

          echo "greet" | sudo tee -a /usr/share/seclists/Discovery/Web-Content/common.txt

      - name: Download sentinel binary
        uses: actions/download-artifact@v4
        with:
          name: sentinel-binary

      - name: Make binary executable
        run: chmod +x sentinel

      # ------------------------------------------------------------------
      # IMPORTANT: main.c parses argv as:  sentinel <outdir> <mode> <arg>
      # so every invocation is <outdir> first, mode second, target last.
      # The old calls passed the URL first, which main.c treated as the
      # mode and failed with "Unknown mode". All fixed below.
      # Each test writes a pass/fail marker into $GITHUB_STEP_SUMMARY so
      # the summary step can report real coverage instead of silently
      # "passing" everything under continue-on-error.
      # ------------------------------------------------------------------
      - name: Run Subdomain test
        continue-on-error: true
        id: test_sub
        run: |
          export PATH="$(ruby -e 'puts Gem.user_dir')/bin:$PATH"
          if ./sentinel test_sub -sub rapyd.org; then
            echo "SUB=pass" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SUB=fail" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run Scan URL tests
        continue-on-error: true
        id: test_scanurl
        run: |
          status=0
          for pair in "echo testscanurlecho" "preview testscanurlpreview" \
                      "search testscanurlsearch" "user testscanurluser"; do
            set -- $pair
            path="$1"; outdir="$2"
            if ./sentinel "$outdir" --scan-url "https://thegod.pythonanywhere.com/$path"; then
              echo "SCANURL-$path=pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "SCANURL-$path=fail" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit $status

      - name: Run Scan Site test
        continue-on-error: true
        id: test_scansite
        run: |
          if ./sentinel testscansite --scan-site https://thegod.pythonanywhere.com/; then
            echo "SCANSITE=pass" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SCANSITE=fail" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run XSS tests
        continue-on-error: true
        id: test_xss
        run: |
          echo "=== XSS TEST ==="
          status=0
          for pair in "xss testxss" "nuclei-xss testnucleixss"; do
            set -- $pair
            path="$1"; outdir="$2"
            if ./sentinel "$outdir" --xss-only "https://thegod.pythonanywhere.com/$path"; then
              echo "XSS-$path=pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "XSS-$path=fail" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit $status

      - name: Test summary
        id: summary
        if: always()
        run: |
          failed=$(grep -c "=fail" "$GITHUB_STEP_SUMMARY" || true)
          passed=$(grep -c "=pass" "$GITHUB_STEP_SUMMARY" || true)
          echo "failed_tests=$failed" >> "$GITHUB_OUTPUT"
          echo "### CI Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Passed: $passed  Failed: $failed" >> "$GITHUB_STEP_SUMMARY"
          # Don't fail the job on flaky external targets, but make the
          # count visible. Flip this to `exit 1` once the test targets
          # are self-hosted and stable.
          [ "$failed" -eq 0 ] || echo "::warning::${failed} test(s) failed"

      - name: Upload all test output directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            test_sub/
            testscanurlecho/
            testscanurlpreview/
            testscanurlsearch/
            testscanurluser/
            testscansite/
            testxss/
            testnucleixss/
            ghostquery/
          retention-days: 14
          if-no-files-found: warn