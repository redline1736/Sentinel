
<!DOCTYPE html>
<html>
<head>
    <title>SecureBank - Login</title>
</head>
<body>
    <h1>SecureBank</h1>

    <h2>Login</h2>

    <form method="POST">
        <input
            name="username"
            placeholder="Username"
            required
        >

        <input
            name="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <p>Lab credentials:</p>
    <p>alice / password123</p>
</body>
</html>
